# yamaha-audio.ro — browser caching for static files and security headers.
# Install:  sudo cp server/apache-yamaha.conf /etc/apache2/conf-available/yamaha.conf
#           sudo a2enconf yamaha && sudo apache2ctl configtest && sudo systemctl reload apache2
<IfModule mod_headers.c>
    # Theme assets are versioned (?ver=file time) and fonts never change: cache a year.
    <FilesMatch "\.(css|js|mjs|woff2?|ttf|otf|eot|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    # Images: a month (ShortPixel can replace a file in place).
    <FilesMatch "\.(jpe?g|png|gif|webp|avif)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header unset X-Powered-By
</IfModule>
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType image/x-icon "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType image/avif "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
</IfModule>
