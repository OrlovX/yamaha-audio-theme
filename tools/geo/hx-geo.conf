# Europe-only access. Visitors whose address is not registered in Europe get "403 Forbidden",
# except the machines listed in allow.inc (Google, Bing, Meta, Apple, Jetpack, the shop's own
# servers) and certificate renewal. The lists are rebuilt weekly by /usr/local/sbin/hx-geo-update.
#
# Source of this file and of the script: the theme, tools/geo/.
# Switch off:  a2disconf hx-geo && systemctl reload apache2
#
# AuthMerging And: this is one more condition on top of the existing rules. It never opens
# something another rule has closed (xmlrpc.php, the blocked crawlers).
<Location "/">
    AuthMerging And
    <RequireAny>
        Require local
        Require expr "%{REQUEST_URI} =~ m#^/\.well-known/acme-challenge/#"
        Include /etc/apache2/hx-geo/europe.inc
        Include /etc/apache2/hx-geo/allow.inc
    </RequireAny>
</Location>
